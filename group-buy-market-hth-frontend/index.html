<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>拼团商城</title>
  </head>
  <body>
    <!-- 
      Vue 应用挂载点
      main.ts 中的 app.mount('#app') 会将整个 Vue 应用渲染到这个 div 中
      【类比后端】类似 Thymeleaf 的 <div layout:fragment="content">，是内容渲染的容器
    -->
    <div id="app"></div>
    <!-- 
      引入 main.ts 入口脚本
      type="module" 表示这是一个 ES 模块，浏览器会按模块方式加载（支持 import/export）
      【类比后端】类似 Spring Boot 的 main() 方法入口
    -->
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
